[package]
name = "deepify-desktop"
version.workspace = true
edition.workspace = true
build = "build.rs"

[lib]
name = "deepify"
path = "src/lib.rs"

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
id3 = "1.17.0"
notify = "8.2.0"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "symphonia-mp3"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
libc = "0.2"
deepify-browser-protocol = { path = "../../../crates/browser-protocol" }
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-single-instance = "2.4.3"
thiserror = "2.0"
url = "2.5"
uuid = { version = "1.18", features = ["v4"] }
walkdir = "2.5"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"

[dev-dependencies]
tempfile = "3.23"

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[[bin]]
name = "deepify"
path = "src/main.rs"
